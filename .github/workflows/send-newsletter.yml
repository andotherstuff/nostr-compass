name: Buttondown publishing disabled

# Buttondown disposition is now an explicit journal effect. This legacy entry
# point remains visible for audit but can never execute or select a newsletter.
on:
  workflow_dispatch:

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' 'Buttondown must be reconciled through the exact-edition publication journal.'
